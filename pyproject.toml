[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "model-ledger"
version = "0.1.0"
description = "Content-addressed artifact registry with immutable lineage, CAS releases and lease-aware garbage collection"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
model-ledger = "model_ledger.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
